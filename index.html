
<!DOCTYPE html>

    <title>Tic-Tac-Toe Game</title>
    <link rel="stylesheet" href="style.css">

<body>

        <h2 id="message">Player X's Turn</h2>

        <div class="board">
            <button class="cell"></button>
            <button class="cell"></button>

            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>
        </div>

        <button id="restart">Restart Game</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
